# StatFacts configuration.
#
# Everything here can also be changed in game by an operator with /statfacts:
#   /statfacts set <key> <value>      for the settings near the top
#   /statfacts stat <id> on|off       for each stat in the "stats" section
#   /statfacts exclude <player> add|remove
# Commands rewrite this file, which drops these comments. Edit by hand, then
# run /statfacts reload to apply.

# Master switch. false = no announcements and no milestones.
enabled: true

# Seconds between random announcements.
interval-seconds: 600

# Only announce while at least this many players (not excluded) are online.
min-players: 1

# Percent chance (0-100) that an announcement compares players online
# (leader, head-to-head or combined total). Needs 2+ players. 0 = never.
multi-chance: 25

# true = single-player facts may be about players who are offline, using their
# saved stats. Comparisons and milestones always need players online.
include-offline: true

# Folder with the players' stat files (<uuid>.json), relative to the server folder.
# Read live: new players appear as soon as the server writes their file.
stats-folder: players/stats

milestones:
  enabled: true
  # Seconds between milestone checks.
  check-seconds: 5
  # A milestone fires when a player's stat crosses one of these values.
  # Values are in the stat's own units: km, count, hours, hearts of damage.
  # Keep each list ascending. The last rung of each list gets "Incredible!".
  km: [100, 1000, 10000]
  count: [1000, 10000, 100000]
  hours: [100, 1000]
  hearts: [1000, 10000]

# Players never named in announcements, by name (case does not matter) or UUID.
excluded-players: []

# Which stats can be announced. true = on, false = off. Milestones for a stat
# follow the same switch.
